name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  # Apple Silicon: every domain runs on Accelerate + rand (task #3). The
  # runner is Apple Silicon so aarch64-apple-darwin is the native host target.
  #
  # `macos-14` is the *standard* arm64 image and is free on a public repo. Do
  # NOT switch this to `macos-14-xlarge`: that is a *larger* runner, which
  # GitHub bills per-minute even on public repositories. This org's spending
  # limit blocks them, so the job is never provisioned — it fails in ~7s having
  # executed zero steps, with the annotation "recent account payments have
  # failed or your spending limit needs to be increased". Standard runners buy
  # the arm64 coverage this job exists for at no cost.
  aarch64-darwin:
    name: aarch64-apple-darwin (Accelerate)
    runs-on: macos-14
    env:
      # The FFT backend uses vDSP's interleaved-complex DFT, which is
      # `API_AVAILABLE(macos(12.0))` (task #13); pin the deployment target so
      # the linker accepts those symbols without an availability warning.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly 1.99 toolchain (native aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --target aarch64-apple-darwin --workspace

      - name: cargo test
        run: cargo test --target aarch64-apple-darwin --workspace

      - name: cargo clippy
        # No `-D warnings`: the toolchain is floating nightly, and a new lint
        # in a nightly release would break CI for reasons unrelated to the
        # code — matching the x86_64 Linux/Windows clippy jobs.
        run: cargo clippy --target aarch64-apple-darwin --workspace --all-targets

  # Apple Silicon + OpenBLAS: the `openblas` feature swaps vecLib for OpenBLAS
  # (BLAS/LAPACK only; FFT/VML/sparse/VSL still use Accelerate). Exercises the
  # --no-default-features path that must fail loudly without a backend.
  aarch64-darwin-openblas:
    name: aarch64-apple-darwin (OpenBLAS)
    # Standard arm64 image, same reasoning as `aarch64-darwin` above — see the
    # note there before reaching for an `-xlarge` label.
    runs-on: macos-14
    env:
      # openblas is keg-only, so `-lopenblas` needs an explicit search path.
      # It must be supplied via OPENBLAS_ROOT — which `nuvai-mkl-src/build.rs`
      # turns into `cargo:rustc-link-search` — and NOT via RUSTFLAGS. This
      # crate is a `[build-dependencies]` entry of `nuvai-mkl` and
      # `nuvai-mkl-sys`, so the propagating `rustc-link-lib` also lands on
      # their *build-script* binaries, and Cargo does not apply RUSTFLAGS to
      # host units: a `RUSTFLAGS: -L ...` never reaches the link that fails,
      # which is why this job could not build before.
      OPENBLAS_ROOT: /opt/homebrew/opt/openblas
      # Same as the Accelerate job: vDSP's interleaved-complex DFT (task #13)
      # is macOS 12.0+, so pin the deployment target for the linker.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: brew install openblas

      - name: Install nightly 1.99 toolchain (native aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (openblas)
        run: cargo check --target aarch64-apple-darwin --workspace --no-default-features --features openblas

      - name: cargo test (openblas)
        run: cargo test --target aarch64-apple-darwin --workspace --no-default-features --features openblas

      - name: cargo clippy (openblas)
        # The parity gap #11 closed: this was the only one of the five jobs with
        # no clippy step. It is also the only lint pass over the `openblas`
        # feature path — the Accelerate job can never compile it, since
        # `accelerate` and `openblas` are mutually exclusive on
        # aarch64-apple-darwin (#35).
        #
        # No `-D warnings`, on the same terms as the other four jobs: floating
        # nightly + new lints = CI breaks unrelated to the code.
        run: cargo clippy --target aarch64-apple-darwin --workspace --all-targets --no-default-features --features openblas

  # ARM64 Linux: OpenBLAS is the sole backend (BLAS/LAPACK only; FFT/VML/VSL/
  # sparse/PARDISO/DSS return ErrorKind::Unsupported). The runner is ARM64 so
  # aarch64-unknown-linux-gnu is the native host target. bindgen is gated off on
  # aarch64, so no libclang is needed here.
  aarch64-linux:
    name: aarch64-unknown-linux-gnu (OpenBLAS)
    runs-on: ubuntu-24.04-arm # public ARM64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install nightly 1.99 toolchain (native aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --target aarch64-unknown-linux-gnu --workspace

      - name: cargo test
        run: cargo test --target aarch64-unknown-linux-gnu --workspace

      - name: cargo clippy
        # No `-D warnings`: floating nightly + new lints = CI breaks unrelated
        # to the code; matches the x86_64 Linux/Windows clippy jobs.
        run: cargo clippy --target aarch64-unknown-linux-gnu --workspace --all-targets

  # x86_64 Linux: Intel oneMKL acquired by nuvai-mkl-src at build time
  # (conda-forge download into ~/.cache/nuvai-mkl). libclang is required by the
  # nuvai-mkl-sys bindgen pass.
  #
  # This job builds with **no feature**, and since #72 that means the *static*
  # link: `nuvai-mkl` and `nuvai-mkl-sys` enable it from a target-gated
  # dependency edge, so the default is the mode that needs no per-binary link
  # arguments. The `x86_64-linux-dynamic` job below is the `dynamic` opt-in —
  # the threaded `mkl_rt` dispatcher, whose binaries do need them.
  x86_64-linux:
    name: x86_64-unknown-linux-gnu (Intel MKL, static default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install nightly 1.99 toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      # This job carries no cache action for ~/.cache/nuvai-mkl (unlike
      # x86_64-windows below), so every run here already starts from a cold
      # acquisition cache — it is the regression guard for #64: extraction
      # used to race the two nuvai-mkl-src build-script units and hand a
      # half-unpacked lib_dir to the linker before the first write ever
      # completed. `cargo test --workspace` alone would only catch that on
      # however this one run happens to interleave, so repeat the cold build a
      # few times (clearing both the MKL cache and cargo's own build cache
      # each time, since a warm `target/` can skip re-running the build
      # scripts that race) to make a reintroduced race fail reliably instead
      # of by chance.
      - name: cargo test (repeated cold-cache builds — regression guard for #64)
        run: |
          for i in 1 2 3; do
            echo "::group::cold-cache attempt $i/3"
            rm -rf ~/.cache/nuvai-mkl target
            cargo test --workspace
            echo "::endgroup::"
          done

      - name: verify the default build links no dynamic MKL runtime
        # #72's own acceptance criterion, asserted rather than assumed: with no
        # feature at all the binary must not merely *start* (which the tests
        # above show) but have no runtime dependency on the dynamic dispatcher —
        # nothing to rpath, no OpenMP runtime to be resolved late. This is the
        # assertion that would have caught #72: it fails for any build that
        # quietly takes the dynamic path.
        #
        # The binaries are located by asking cargo, not by looking in
        # `target/debug/deps` — see the same step's note in the #70 history: a
        # nightly moved test executables into the split build-dir layout, and a
        # `find` by path silently matched nothing for two runs on `main`.
        run: |
          bins=$(cargo test --workspace --no-run --message-format=json 2>/dev/null \
            | grep -F 'crates/nuvai-mkl/Cargo.toml' \
            | grep -oE '"executable":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$bins" ]; then
            echo "::error::cargo reported no nuvai-mkl test executables to check"
            exit 1
          fi
          for bin in $bins; do
            echo "checking $bin"
            ldd "$bin"
            if ldd "$bin" | grep -qE 'libmkl_rt|libiomp5|libomp\.so'; then
              echo "::error::$bin links a dynamic MKL/OpenMP runtime, but this job passes no feature — the static default (#72) is not in effect"
              exit 1
            fi
          done

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  # x86_64 Linux, the `dynamic` **opt-in** (#72): the threaded `mkl_rt`
  # dispatcher instead of the static archives a bare dependency now gets. This
  # job is what keeps the workspace covered on the path `x86_64-linux` left —
  # and the assertion it adds is the mirror of that job's, so a build that
  # silently takes the wrong one fails either way.
  #
  # It caches ~/.cache/nuvai-mkl across runs (unlike `x86_64-linux`, which is
  # deliberately cold every run to guard #64) because its `mkl` package is the
  # larger acquisition of the two and nothing here is a regression guard for
  # acquisition.
  x86_64-linux-dynamic:
    name: x86_64-unknown-linux-gnu (Intel MKL, dynamic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install nightly 1.99 toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache the conda-forge MKL acquisition
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvai-mkl
          key: nuvai-mkl-conda-dynamic-linux-${{ hashFiles('crates/nuvai-mkl-src/src/acquire.rs') }}

      - name: cargo test (dynamic)
        # The `dynamic` feature is the only difference from the job above, and
        # the workspace's own binaries are covered here because the *caller* in
        # that case is `nuvai-mkl/build.rs` — the same
        # `emit_binary_link_args` a downstream consumer calls (#70).
        run: cargo test --workspace --features dynamic

      - name: cargo clippy (dynamic)
        run: cargo clippy --workspace --all-targets --features dynamic

      - name: verify the dynamic path really is dynamic
        # The mirror of `x86_64-linux`'s check, and the reason both exist: a
        # feature that silently stopped selecting its arm would otherwise leave
        # one of the two jobs passing for the wrong reason. `libmkl_rt` in
        # DT_NEEDED is the direct evidence that `dynamic` is what was built.
        run: |
          bins=$(cargo test --workspace --features dynamic --no-run --message-format=json 2>/dev/null \
            | grep -F 'crates/nuvai-mkl/Cargo.toml' \
            | grep -oE '"executable":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$bins" ]; then
            echo "::error::cargo reported no nuvai-mkl test executables to check"
            exit 1
          fi
          for bin in $bins; do
            echo "checking $bin"
            readelf -d "$bin" | grep -E 'NEEDED|RUNPATH'
            if ! readelf -d "$bin" | grep -q 'libmkl_rt'; then
              echo "::error::$bin does not link libmkl_rt, but this job passes --features dynamic — the opt-in (#72) is not in effect"
              exit 1
            fi
          done

  # x86_64 Linux, consumed from *outside* the workspace (#70). Every other job
  # here builds this repository's own targets, and Cargo scopes a build script's
  # `rustc-link-arg` to the emitting package's own targets — so a whole class of
  # breakage in which both link paths worked here and neither worked for a crate
  # that merely depended on `nuvai-mkl` passed every one of them. These three
  # fixtures are the missing check: separate workspaces, depending on
  # `crates/nuvai-mkl` by path, each building and — the last one excepted, by
  # design — *running* a binary.
  #
  # Three fixtures, four runs, and between them the whole link-mode matrix:
  #
  # * `dependency-only` declares no link plumbing *and no feature*, which since
  #   #72 is the default static link — the case the issue filed, and the one
  #   that used to link and then fail at start-up.
  # * `build-script-helper` covers the `dynamic` opt-in, where an executable's
  #   rpath cannot be emitted by anything but its own build script, and re-runs
  #   under `static` (spelled out) where that same call emits nothing.
  # * `dynamic-no-plumbing` is the negative: `dynamic` with no build script must
  #   build with a warning and must *not* start. Asserting the failure is the
  #   point — it is the documented contract for that combination, and #72 is
  #   what it costs when the failure arrives silent instead.
  x86_64-linux-downstream:
    name: x86_64-unknown-linux-gnu (downstream consumers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install nightly 1.99 toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      # Both the `mkl-static` and the dynamic `mkl` package, since the runs
      # below cross between them. Same key shape as the two jobs above, and
      # same invalidation: a change to the acquisition is what changes which
      # archives are fetched.
      - name: Cache the conda-forge MKL acquisition
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvai-mkl
          key: nuvai-mkl-conda-consumers-linux-${{ hashFiles('crates/nuvai-mkl-src/src/acquire.rs') }}

      # The default, and #72's regression guard: no build script, no
      # `[build-dependencies]`, no `.cargo/config.toml`, no `RUSTFLAGS`, no
      # feature — and the static link must still be what this gets. The warning
      # check is the other half: a `dynamic` warning on this path would mean the
      # static default had stopped being reached, which is the same defect seen
      # from the other side.
      - name: dependency-only consumer, default — no build script, nothing configured
        run: |
          set -o pipefail
          cargo run --manifest-path consumers/dependency-only/Cargo.toml 2>&1 | tee /tmp/dependency-only.log
          if grep -q 'linking the dynamic oneMKL runtime' /tmp/dependency-only.log; then
            echo "::error::the default build took the dynamic path — #72's static default is not in effect"
            exit 1
          fi

      - name: build-script-helper consumer, static — the same call emits nothing
        run: cargo run --manifest-path consumers/build-script-helper/Cargo.toml --features static

      # The `dynamic` opt-in with its arguments supplied: this is the
      # threaded `mkl_rt` path working, and the warning it prints is expected
      # here — it is emitted for the opt-in, at build time, which is the half of
      # #72 that is about *when* the requirement is disclosed.
      - name: build-script-helper consumer, dynamic
        run: |
          set -o pipefail
          cargo run --manifest-path consumers/build-script-helper/Cargo.toml --features dynamic 2>&1 | tee /tmp/build-script-helper.log
          if ! grep -q 'linking the dynamic oneMKL runtime' /tmp/build-script-helper.log; then
            echo "::error::the dynamic opt-in built without the warning that says what its binaries need"
            exit 1
          fi

      # The negative fixture: `dynamic` with no plumbing must build with that
      # same warning and must not start. Run in a fresh target dir so the build
      # script certainly re-runs and prints it.
      #
      # The binary is executed directly rather than through `cargo run` because
      # the failure is the loader's, and `cargo run` would be one more process
      # between the two — the assertion is that the *binary* cannot start.
      - name: dynamic-no-plumbing consumer — warns, then fails to start
        run: |
          set -o pipefail
          # `Swatinem/rust-cache` caches the root workspace only, so this one is
          # cold on every run anyway — the `rm` is what makes the warning
          # assertion below deterministic rather than dependent on that.
          rm -rf consumers/dynamic-no-plumbing/target
          cargo build --manifest-path consumers/dynamic-no-plumbing/Cargo.toml 2>&1 | tee /tmp/no-plumbing.log
          if ! grep -q 'linking the dynamic oneMKL runtime' /tmp/no-plumbing.log; then
            echo "::error::no warning on the dynamic path — #72's disclosure is missing"
            exit 1
          fi

          bin=consumers/dynamic-no-plumbing/target/debug/nuvai-mkl-consumer-dynamic-no-plumbing
          if out=$("$bin" 2>&1); then
            echo "::error::$bin started, but this combination is documented as unable to (no runtime search path — ADR-0006)"
            exit 1
          fi
          echo "$out"
          if ! echo "$out" | grep -q 'libmkl_rt.so.3: cannot open shared object file'; then
            echo "::error::$bin failed for a reason other than the documented one"
            exit 1
          fi

  # x86_64 Windows MSVC: Intel oneMKL acquired by nuvai-mkl-src at build time
  # (conda-forge download into %USERPROFILE%\.cache\nuvai-mkl — HOME is commonly
  # unset on Windows). The win-64 `mkl` package ships 26 DLLs but no import
  # libs; `mkl-devel` provides `mkl_rt.lib` (→ `mkl_rt.3.dll`). bindgen needs
  # LLVM/libclang, so it is installed via Chocolatey.
  x86_64-windows:
    name: x86_64-pc-windows-msvc (Intel MKL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (bindgen)
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install nightly 1.99 toolchain (native x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache MKL conda download
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvai-mkl
          key: nuvai-mkl-conda-win-${{ hashFiles('crates/nuvai-mkl-src/src/acquire.rs') }}

      - name: cargo check
        run: cargo check --workspace

      # Windows has no rpath: the loader resolves mkl_rt.3.dll (and its runtime
      # deps libiomp5md.dll / tbb12.dll) from PATH at process start. Every
      # extracted conda package puts its DLLs under <cache>/mkl-2026.1.0/<pkg>/Library/bin;
      # prepend each before running the tests so the 6 domain smoke tests can
      # load the runtime without a manual copy.
      - name: Add MKL DLL dir to PATH
        shell: pwsh
        run: |
          $dllDirs = @()
          foreach ($root in Get-ChildItem "$env:USERPROFILE\.cache\nuvai-mkl\mkl-2026.1.0" -Directory) {
            $bin = Join-Path $root.FullName "Library\bin"
            if (Test-Path $bin) { $dllDirs += $bin }
          }
          if ($dllDirs.Count -eq 0) { throw "No MKL runtime DLL dirs found under ~/.cache/nuvai-mkl/mkl-2026.1.0" }
          foreach ($d in $dllDirs) { Write-Host "MKL DLL dir: $d"; "$d" >> $env:GITHUB_PATH }

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
