name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  # Apple Silicon: every domain runs on Accelerate + rand (task #3). The
  # runner is Apple Silicon so aarch64-apple-darwin is the native host target.
  #
  # `macos-14` is the *standard* arm64 image and is free on a public repo. Do
  # NOT switch this to `macos-14-xlarge`: that is a *larger* runner, which
  # GitHub bills per-minute even on public repositories. This org's spending
  # limit blocks them, so the job is never provisioned — it fails in ~7s having
  # executed zero steps, with the annotation "recent account payments have
  # failed or your spending limit needs to be increased". Standard runners buy
  # the arm64 coverage this job exists for at no cost.
  aarch64-darwin:
    name: aarch64-apple-darwin (Accelerate)
    runs-on: macos-14
    env:
      # The FFT backend uses vDSP's interleaved-complex DFT, which is
      # `API_AVAILABLE(macos(12.0))` (task #13); pin the deployment target so
      # the linker accepts those symbols without an availability warning.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly 1.99 toolchain (native aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --target aarch64-apple-darwin --workspace

      # DIAG-53 (issue #53): throwaway step on a throwaway branch. `--nocapture`
      # so the instrumentation's stdout reaches the log even if the process
      # aborts (it does: SIGABRT on the macos-14 image).
      - name: DIAG-53 FFT/vDSP evidence (never merged)
        run: cargo test --target aarch64-apple-darwin -p nuvai-mkl --test aa_diag53 -- --nocapture
        continue-on-error: true

      - name: cargo test
        run: cargo test --target aarch64-apple-darwin --workspace --no-fail-fast

      - name: cargo clippy
        # No `-D warnings`: the toolchain is floating nightly, and a new lint
        # in a nightly release would break CI for reasons unrelated to the
        # code — matching the x86_64 Linux/Windows clippy jobs.
        run: cargo clippy --target aarch64-apple-darwin --workspace --all-targets

  # Apple Silicon + OpenBLAS: the `openblas` feature swaps vecLib for OpenBLAS
  # (BLAS/LAPACK only; FFT/VML/sparse/VSL still use Accelerate). Exercises the
  # --no-default-features path that must fail loudly without a backend.
  aarch64-darwin-openblas:
    name: aarch64-apple-darwin (OpenBLAS)
    # Standard arm64 image, same reasoning as `aarch64-darwin` above — see the
    # note there before reaching for an `-xlarge` label.
    runs-on: macos-14
    env:
      # openblas is keg-only, so `-lopenblas` needs an explicit search path.
      # It must be supplied via OPENBLAS_ROOT — which `nuvai-mkl-src/build.rs`
      # turns into `cargo:rustc-link-search` — and NOT via RUSTFLAGS. This
      # crate is a `[build-dependencies]` entry of `nuvai-mkl` and
      # `nuvai-mkl-sys`, so the propagating `rustc-link-lib` also lands on
      # their *build-script* binaries, and Cargo does not apply RUSTFLAGS to
      # host units: a `RUSTFLAGS: -L ...` never reaches the link that fails,
      # which is why this job could not build before.
      OPENBLAS_ROOT: /opt/homebrew/opt/openblas
      # Same as the Accelerate job: vDSP's interleaved-complex DFT (task #13)
      # is macOS 12.0+, so pin the deployment target for the linker.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: brew install openblas

      - name: Install nightly 1.99 toolchain (native aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (openblas)
        run: cargo check --target aarch64-apple-darwin --workspace --no-default-features --features openblas

      - name: cargo test (openblas)
        run: cargo test --target aarch64-apple-darwin --workspace --no-default-features --features openblas --no-fail-fast

  # ARM64 Linux: OpenBLAS is the sole backend (BLAS/LAPACK only; FFT/VML/VSL/
  # sparse/PARDISO/DSS return ErrorKind::Unsupported). The runner is ARM64 so
  # aarch64-unknown-linux-gnu is the native host target. bindgen is gated off on
  # aarch64, so no libclang is needed here.
  aarch64-linux:
    name: aarch64-unknown-linux-gnu (OpenBLAS)
    runs-on: ubuntu-24.04-arm # public ARM64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install nightly 1.99 toolchain (native aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --target aarch64-unknown-linux-gnu --workspace

      - name: cargo test
        run: cargo test --target aarch64-unknown-linux-gnu --workspace

      - name: cargo clippy
        # No `-D warnings`: floating nightly + new lints = CI breaks unrelated
        # to the code; matches the x86_64 Linux/Windows clippy jobs.
        run: cargo clippy --target aarch64-unknown-linux-gnu --workspace --all-targets

  # x86_64 Linux: Intel oneMKL acquired by nuvai-mkl-src at build time
  # (conda-forge download into ~/.cache/nuvai-mkl). libclang is required by the
  # nuvai-mkl-sys bindgen pass.
  x86_64-linux:
    name: x86_64-unknown-linux-gnu (Intel MKL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install nightly 1.99 toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  # x86_64 Windows MSVC: Intel oneMKL acquired by nuvai-mkl-src at build time
  # (conda-forge download into %USERPROFILE%\.cache\nuvai-mkl — HOME is commonly
  # unset on Windows). The win-64 `mkl` package ships 26 DLLs but no import
  # libs; `mkl-devel` provides `mkl_rt.lib` (→ `mkl_rt.3.dll`). bindgen needs
  # LLVM/libclang, so it is installed via Chocolatey.
  x86_64-windows:
    name: x86_64-pc-windows-msvc (Intel MKL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (bindgen)
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install nightly 1.99 toolchain (native x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache MKL conda download
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvai-mkl
          key: nuvai-mkl-conda-win-${{ hashFiles('crates/nuvai-mkl-src/src/acquire.rs') }}

      - name: cargo check
        run: cargo check --workspace

      # Windows has no rpath: the loader resolves mkl_rt.3.dll (and its runtime
      # deps libiomp5md.dll / tbb12.dll) from PATH at process start. Every
      # extracted conda package puts its DLLs under <cache>/mkl-2026.1.0/<pkg>/Library/bin;
      # prepend each before running the tests so the 6 domain smoke tests can
      # load the runtime without a manual copy.
      - name: Add MKL DLL dir to PATH
        shell: pwsh
        run: |
          $dllDirs = @()
          foreach ($root in Get-ChildItem "$env:USERPROFILE\.cache\nuvai-mkl\mkl-2026.1.0" -Directory) {
            $bin = Join-Path $root.FullName "Library\bin"
            if (Test-Path $bin) { $dllDirs += $bin }
          }
          if ($dllDirs.Count -eq 0) { throw "No MKL runtime DLL dirs found under ~/.cache/nuvai-mkl/mkl-2026.1.0" }
          foreach ($d in $dllDirs) { Write-Host "MKL DLL dir: $d"; "$d" >> $env:GITHUB_PATH }

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
