name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  # Apple Silicon: every domain runs on Accelerate + rand (task #3). The
  # runner is Apple Silicon so aarch64-apple-darwin is the native host target.
  #
  # `macos-14` is the *standard* arm64 image and is free on a public repo. Do
  # NOT switch this to `macos-14-xlarge`: that is a *larger* runner, which
  # GitHub bills per-minute even on public repositories. This org's spending
  # limit blocks them, so the job is never provisioned — it fails in ~7s having
  # executed zero steps, with the annotation "recent account payments have
  # failed or your spending limit needs to be increased". Standard runners buy
  # the arm64 coverage this job exists for at no cost.
  aarch64-darwin:
    name: aarch64-apple-darwin (Accelerate)
    runs-on: macos-14
    env:
      # The FFT backend uses vDSP's interleaved-complex DFT, which is
      # `API_AVAILABLE(macos(12.0))` (task #13); pin the deployment target so
      # the linker accepts those symbols without an availability warning.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly 1.99 toolchain (native aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --target aarch64-apple-darwin --workspace

      - name: cargo test
        run: cargo test --target aarch64-apple-darwin --workspace

      - name: cargo clippy
        # No `-D warnings`: the toolchain is floating nightly, and a new lint
        # in a nightly release would break CI for reasons unrelated to the
        # code — matching the x86_64 Linux/Windows clippy jobs.
        run: cargo clippy --target aarch64-apple-darwin --workspace --all-targets

  # Apple Silicon + OpenBLAS: the `openblas` feature swaps vecLib for OpenBLAS
  # (BLAS/LAPACK only; FFT/VML/sparse/VSL still use Accelerate). Exercises the
  # --no-default-features path that must fail loudly without a backend.
  aarch64-darwin-openblas:
    name: aarch64-apple-darwin (OpenBLAS)
    # Standard arm64 image, same reasoning as `aarch64-darwin` above — see the
    # note there before reaching for an `-xlarge` label.
    runs-on: macos-14
    env:
      # openblas is keg-only, so `-lopenblas` needs an explicit search path.
      # It must be supplied via OPENBLAS_ROOT — which `nuvai-mkl-src/build.rs`
      # turns into `cargo:rustc-link-search` — and NOT via RUSTFLAGS. This
      # crate is a `[build-dependencies]` entry of `nuvai-mkl` and
      # `nuvai-mkl-sys`, so the propagating `rustc-link-lib` also lands on
      # their *build-script* binaries, and Cargo does not apply RUSTFLAGS to
      # host units: a `RUSTFLAGS: -L ...` never reaches the link that fails,
      # which is why this job could not build before.
      OPENBLAS_ROOT: /opt/homebrew/opt/openblas
      # Same as the Accelerate job: vDSP's interleaved-complex DFT (task #13)
      # is macOS 12.0+, so pin the deployment target for the linker.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: brew install openblas

      - name: Install nightly 1.99 toolchain (native aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (openblas)
        run: cargo check --target aarch64-apple-darwin --workspace --no-default-features --features openblas

      - name: cargo test (openblas)
        run: cargo test --target aarch64-apple-darwin --workspace --no-default-features --features openblas

      - name: cargo clippy (openblas)
        # The parity gap #11 closed: this was the only one of the five jobs with
        # no clippy step. It is also the only lint pass over the `openblas`
        # feature path — the Accelerate job can never compile it, since
        # `accelerate` and `openblas` are mutually exclusive on
        # aarch64-apple-darwin (#35).
        #
        # No `-D warnings`, on the same terms as the other four jobs: floating
        # nightly + new lints = CI breaks unrelated to the code.
        run: cargo clippy --target aarch64-apple-darwin --workspace --all-targets --no-default-features --features openblas

  # ARM64 Linux: OpenBLAS is the sole backend (BLAS/LAPACK only; FFT/VML/VSL/
  # sparse/PARDISO/DSS return ErrorKind::Unsupported). The runner is ARM64 so
  # aarch64-unknown-linux-gnu is the native host target. bindgen is gated off on
  # aarch64, so no libclang is needed here.
  aarch64-linux:
    name: aarch64-unknown-linux-gnu (OpenBLAS)
    runs-on: ubuntu-24.04-arm # public ARM64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Install nightly 1.99 toolchain (native aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --target aarch64-unknown-linux-gnu --workspace

      - name: cargo test
        run: cargo test --target aarch64-unknown-linux-gnu --workspace

      - name: cargo clippy
        # No `-D warnings`: floating nightly + new lints = CI breaks unrelated
        # to the code; matches the x86_64 Linux/Windows clippy jobs.
        run: cargo clippy --target aarch64-unknown-linux-gnu --workspace --all-targets

  # x86_64 Linux: Intel oneMKL acquired by nuvai-mkl-src at build time
  # (conda-forge download into ~/.cache/nuvai-mkl). libclang is required by the
  # nuvai-mkl-sys bindgen pass.
  x86_64-linux:
    name: x86_64-unknown-linux-gnu (Intel MKL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install nightly 1.99 toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      # This job carries no cache action for ~/.cache/nuvai-mkl (unlike
      # x86_64-windows below), so every run here already starts from a cold
      # acquisition cache — it is the regression guard for #64: extraction
      # used to race the two nuvai-mkl-src build-script units and hand a
      # half-unpacked lib_dir to the linker before the first write ever
      # completed. `cargo test --workspace` alone would only catch that on
      # however this one run happens to interleave, so repeat the cold build a
      # few times (clearing both the MKL cache and cargo's own build cache
      # each time, since a warm `target/` can skip re-running the build
      # scripts that race) to make a reintroduced race fail reliably instead
      # of by chance.
      - name: cargo test (repeated cold-cache builds — regression guard for #64)
        run: |
          for i in 1 2 3; do
            echo "::group::cold-cache attempt $i/3"
            rm -rf ~/.cache/nuvai-mkl target
            cargo test --workspace
            echo "::endgroup::"
          done

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  # x86_64 Linux, static (`static` feature — ADR-0005, #68): links Intel
  # oneMKL's static archives instead of the dynamic `mkl_rt` dispatcher.
  # Acquires a much larger conda-forge package (`mkl-static`, ~130 MB
  # compressed) than the dynamic `mkl` package the job above uses, so —
  # unlike `x86_64-linux`, which is intentionally cold every run to guard
  # against #64 — this job caches ~/.cache/nuvai-mkl across runs.
  x86_64-linux-static:
    name: x86_64-unknown-linux-gnu (Intel MKL, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install nightly 1.99 toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache the conda-forge MKL static archive acquisition
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvai-mkl
          key: nuvai-mkl-conda-static-linux-${{ hashFiles('crates/nuvai-mkl-src/src/acquire.rs') }}

      - name: cargo build (static)
        run: cargo build --workspace --features static

      - name: cargo test (static)
        run: cargo test --workspace --features static

      - name: cargo clippy (static)
        run: cargo clippy --workspace --all-targets --features static

      - name: verify no runtime dependency on the dynamic MKL dispatcher
        # The whole point of `static`: the resulting binary must not link
        # libmkl_rt.so or libiomp5.so/libomp.so at all (the sequential
        # threading layer needs no OpenMP runtime — see ADR-0005 decision 4).
        # `ldd` on any nuvai-mkl test binary is a direct check of that, rather
        # than trusting the build succeeded for the reason we think it did.
        run: |
          bin=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'nuvai_mkl-*' | head -n1)
          if [ -z "$bin" ]; then
            echo "::error::no nuvai_mkl test binary found under target/debug/deps"
            exit 1
          fi
          echo "checking $bin"
          ldd "$bin"
          if ldd "$bin" | grep -qE 'libmkl_rt|libiomp5|libomp\.so'; then
            echo "::error::static build still links a dynamic MKL/OpenMP runtime library"
            ldd "$bin"
            exit 1
          fi

  # x86_64 Linux, consumed from *outside* the workspace (#70). Every other job
  # here builds this repository's own targets, and Cargo scopes a build script's
  # `rustc-link-arg` to the emitting package's own targets — so a whole class of
  # breakage in which both link paths worked here and neither worked for a crate
  # that merely depended on `nuvai-mkl` passed every one of them. These two
  # fixtures are the missing check: separate workspaces, depending on
  # `crates/nuvai-mkl` by path, each building and *running* a binary.
  #
  # `dependency-only` declares no link plumbing at all and must work under
  # `static` (the fix); `build-script-helper` covers the dynamic path, where an
  # executable's rpath cannot be emitted by anything but its own build script,
  # and re-runs under `static`, where that same call emits nothing.
  x86_64-linux-downstream:
    name: x86_64-unknown-linux-gnu (downstream consumers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install nightly 1.99 toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      # Both the dynamic `mkl` package and the ~130 MB `mkl-static` one, since
      # the three runs below cross between them. Same key shape as the static
      # job above, and same invalidation: a change to the acquisition is what
      # changes which archives are fetched.
      - name: Cache the conda-forge MKL acquisition
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvai-mkl
          key: nuvai-mkl-conda-consumers-linux-${{ hashFiles('crates/nuvai-mkl-src/src/acquire.rs') }}

      - name: dependency-only consumer, static — no build script, nothing configured
        run: cargo run --manifest-path consumers/dependency-only/Cargo.toml

      - name: build-script-helper consumer, dynamic
        run: cargo run --manifest-path consumers/build-script-helper/Cargo.toml

      - name: build-script-helper consumer, static — the same call emits nothing
        run: cargo run --manifest-path consumers/build-script-helper/Cargo.toml --features static

  # x86_64 Windows MSVC: Intel oneMKL acquired by nuvai-mkl-src at build time
  # (conda-forge download into %USERPROFILE%\.cache\nuvai-mkl — HOME is commonly
  # unset on Windows). The win-64 `mkl` package ships 26 DLLs but no import
  # libs; `mkl-devel` provides `mkl_rt.lib` (→ `mkl_rt.3.dll`). bindgen needs
  # LLVM/libclang, so it is installed via Chocolatey.
  x86_64-windows:
    name: x86_64-pc-windows-msvc (Intel MKL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (bindgen)
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install nightly 1.99 toolchain (native x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache MKL conda download
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvai-mkl
          key: nuvai-mkl-conda-win-${{ hashFiles('crates/nuvai-mkl-src/src/acquire.rs') }}

      - name: cargo check
        run: cargo check --workspace

      # Windows has no rpath: the loader resolves mkl_rt.3.dll (and its runtime
      # deps libiomp5md.dll / tbb12.dll) from PATH at process start. Every
      # extracted conda package puts its DLLs under <cache>/mkl-2026.1.0/<pkg>/Library/bin;
      # prepend each before running the tests so the 6 domain smoke tests can
      # load the runtime without a manual copy.
      - name: Add MKL DLL dir to PATH
        shell: pwsh
        run: |
          $dllDirs = @()
          foreach ($root in Get-ChildItem "$env:USERPROFILE\.cache\nuvai-mkl\mkl-2026.1.0" -Directory) {
            $bin = Join-Path $root.FullName "Library\bin"
            if (Test-Path $bin) { $dllDirs += $bin }
          }
          if ($dllDirs.Count -eq 0) { throw "No MKL runtime DLL dirs found under ~/.cache/nuvai-mkl/mkl-2026.1.0" }
          foreach ($d in $dllDirs) { Write-Host "MKL DLL dir: $d"; "$d" >> $env:GITHUB_PATH }

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
