[package]
name = "nuvai-mkl-consumer-build-script"
description = "Fixture: a downstream crate that supplies the per-binary link arguments itself (#70, #72)"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
build = "build.rs"

# Its own workspace, for the same reason as
# `consumers/dependency-only/Cargo.toml`: the distinction is between the package
# that emits a build-script linker argument and the package that links it, and
# the feature selection has to be pinned rather than unified with the root
# workspace's.
[workspace]

[dependencies]
nuvai-mkl = { path = "../../crates/nuvai-mkl", default-features = false }
# Required, and required *here* rather than only below: Cargo forwards a `links`
# provider's `DEP_MKL_*` metadata to a build script through the package's normal
# `[dependencies]` edge only — a `[build-dependencies]` entry receives none of it
# (#70, verified: the same build script reads `DEP_MKL_LIB_DIR` unset with the
# build-dependency alone). The build script reads those paths to emit this
# crate's rpath; without this line it emits the warning instead, and the binary
# fails to start. This fixture also calls `nuvai_mkl_src::backend_tag()` to
# report the backend, which is the documented use of the crate in code — a
# consumer that does not would see Cargo's "unused dependency" note for it.
nuvai-mkl-src = { path = "../../crates/nuvai-mkl-src", default-features = false }

[build-dependencies]
# The same crate again, because a build script can only *use* code from this
# table: `nuvai_mkl_src::emit_binary_link_args` is the call `build.rs` makes.
nuvai-mkl-src = { path = "../../crates/nuvai-mkl-src", default-features = false }

[features]
# The two link modes, named from a consumer, the way a real downstream crate
# would — and since #72 they are a real pair rather than a default and an
# opt-in: `static` is what this crate gets with no feature at all, and `dynamic`
# is the opt-out that restores the threaded `mkl_rt` dispatcher.
#
# `--features static` is therefore the explicit spelling of the default: it
# changes nothing, and is kept as a CI run because it is what a consumer reading
# the pre-#72 README would have written. `--features dynamic` is the one that
# changes the build — and, with this fixture's `build.rs` in place, the one that
# proves the per-binary link arguments are what make that build runnable.
static = ["nuvai-mkl/static"]
dynamic = ["nuvai-mkl/dynamic"]
