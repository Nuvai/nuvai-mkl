[package]
name = "nuvai-mkl-src"
description = "Acquire and link Intel oneMKL 2026.1.0 — system-detect (MKLROOT/oneAPI) or download from conda-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "mkl"

[features]
# Backend selection on aarch64-apple-darwin, where Intel ships no oneMKL.
# `accelerate` is the default; `openblas` is the opt-in alternative. On every
# other target these flags are no-ops (Intel MKL is used and the fallback code
# is cfg(target_arch = "aarch64")-gated). Selection is explicit, never silent.
default = ["accelerate"]
accelerate = []
openblas = []

[dependencies]
ureq = "2.12"
zip = "0.6"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"

[build-dependencies]
ureq = "2.12"
zip = "0.6"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
