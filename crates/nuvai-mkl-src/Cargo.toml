[package]
name = "nuvai-mkl-src"
description = "Acquire and link Intel oneMKL 2026.1.0 — system-detect (MKLROOT/oneAPI) or download from conda-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "mkl"

[features]
# Backend selection on aarch64-apple-darwin, where Intel ships no oneMKL.
# `accelerate` is the default; `openblas` is the opt-in alternative. On every
# other target these flags are no-ops (Intel MKL is used, or OpenBLAS is the
# sole backend on aarch64-unknown-linux-gnu, and the fallback code is
# cfg(target_arch = "aarch64")-gated). Selection is explicit, never silent.
default = ["accelerate"]
accelerate = []
openblas = []

# Link Intel oneMKL statically instead of via the dynamic runtime dispatcher
# (`mkl_rt`) — `x86_64-unknown-linux-gnu` (glibc) only (ADR-0005). A compile
# error rejects it on every other target — see `backend.rs` — rather than
# silently falling back to a dynamic link the caller did not ask for.
#
# **This is the default on that target** (#72): `nuvai-mkl` and `nuvai-mkl-sys`
# enable it from a target-gated dependency edge, so a consumer that declares
# nothing but the dependency gets a binary that links *and runs*, with no build
# script, no rpath and no `LD_LIBRARY_PATH`. What it costs is MKL's own
# threading — the static link uses `mkl_sequential` (ADR-0005 decision 4), since
# conda-forge's `llvm-openmp` ships no static archive to link the threaded layer
# against — and a larger binary. `dynamic` below is the opt-out for callers who
# want that threading back.
static = []

# Link the dynamic runtime dispatcher (`mkl_rt`) instead of the static
# archives: the **opt-out** from `static`, and the only way to get MKL's own
# OpenMP threading (#72). It is explicit because it is the path with a
# requirement that cannot be met from here: a dependent's binary must find
# `libmkl_rt.so.3` at load time, and no Cargo directive can put a runtime search
# path on another package's binary (ADR-0006) — so a caller that selects it owns
# the per-binary link arguments (`nuvai_mkl_src::emit_binary_link_args`) or an
# `LD_LIBRARY_PATH` at run time. `nuvai-mkl-src`'s build script says so on the
# `dynamic` path.
#
# Inert on every other target, where the backend is inherently dynamic
# (Accelerate/OpenBLAS have no static form, and the Windows conda package has no
# static archives) — unlike `static`, which asks for something those targets
# cannot do and is therefore rejected there.
dynamic = []

# There is deliberately no `[dependencies]`. Acquisition runs entirely in
# `build.rs`, so these are needed only to compile a build script (#24); declaring
# them here as well put `ureq`/`zip`/`zstd`/`tar`/`sha2` — and their trees,
# rustls/ring/icu and ~114 crates — in the *runtime* dependency graph of every
# downstream build, though nothing at runtime referenced them. The library target
# compiles `src/mkl_info.rs`, `src/backend.rs` and `src/link_args.rs` only;
# `src/acquire.rs`, which uses these crates, is `include!`d by `build.rs` alone.
[build-dependencies]
ureq = "2.12"
zip = "0.6"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
# Compiles `build/force_runtime.c` for the dynamic x86_64 Linux arm of
# `build.rs`, which then publishes the object's path as `DEP_MKL_FORCE_OBJ` so
# that a *dependent's* build script can pass the same object to its own linker
# (#70). It lives here, in the crate that owns the `links = "mkl"` metadata
# channel, rather than in each crate that links — see `build.rs`.
cc = "1"

# docs.rs has no network and no MKL; build with no features so the
# docs.rs build never pulls acquisition/linking (build.rs also short-circuits on DOCS_RS).
[package.metadata.docs.rs]
all-features = false
default-features = false
