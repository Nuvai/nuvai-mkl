[package]
name = "nuvai-mkl-sys"
description = "Raw FFI bindings to the Intel oneMKL 2026.1.0 C interface (hand-written Accelerate surface on Apple Silicon)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
# Forward backend selection to `nuvai-mkl-src`, the sole link-directive
# emitter. `accelerate` (default) links the Accelerate framework on Apple
# Silicon; `openblas` links -lopenblas instead. On aarch64-unknown-linux-gnu
# OpenBLAS is the only backend and on Intel targets these flags are no-ops
# (the fallback code is cfg(target_arch = "aarch64")-gated).
default = ["accelerate"]
accelerate = ["nuvai-mkl-src/accelerate"]
openblas = ["nuvai-mkl-src/openblas"]

[dependencies]
nuvai-mkl-src = { workspace = true }

[build-dependencies]
nuvai-mkl-src = { workspace = true }

# bindgen is only needed where oneMKL headers exist (Intel targets). On
# aarch64-apple-darwin and aarch64-unknown-linux-gnu the FFI surface is
# hand-written and x86_64-apple-darwin is unsupported.
[target.'cfg(all(not(target_os = "macos"), not(target_arch = "aarch64")))'.build-dependencies]
bindgen = "0.71"

# docs.rs has no network and no MKL; build with no features so the
# docs.rs build never pulls acquisition/linking (build.rs also short-circuits on DOCS_RS).
[package.metadata.docs.rs]
all-features = false
default-features = false
