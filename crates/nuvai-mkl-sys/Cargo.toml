[package]
name = "nuvai-mkl-sys"
description = "Raw FFI bindings to the Intel oneMKL 2026.1.0 C interface (hand-written Accelerate surface on Apple Silicon)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
# Forward backend selection to `nuvai-mkl-src`, the sole link-directive
# emitter. `accelerate` (default) links the Accelerate framework on aarch64;
# `openblas` links -lopenblas instead. On every other target these flags are
# no-ops (Intel MKL is used and the fallback code is cfg(target_arch =
# "aarch64")-gated).
default = ["accelerate"]
accelerate = ["nuvai-mkl-src/accelerate"]
openblas = ["nuvai-mkl-src/openblas"]

[dependencies]
nuvai-mkl-src = { workspace = true }

[build-dependencies]
nuvai-mkl-src = { workspace = true }

# bindgen is only needed where oneMKL headers exist; on aarch64-apple-darwin
# the FFI surface is hand-written and x86_64-apple-darwin is unsupported.
[target.'cfg(not(target_os = "macos"))'.build-dependencies]
bindgen = "0.71"
