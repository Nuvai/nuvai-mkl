[package]
name = "nuvai-mkl-sys"
description = "Raw FFI bindings to the Intel oneMKL 2026.1.0 C interface (hand-written Accelerate surface on Apple Silicon)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
# Forward backend selection to `nuvai-mkl-src`, the sole link-directive
# emitter. `accelerate` (default) links the Accelerate framework on Apple
# Silicon; `openblas` links -lopenblas instead. On aarch64-unknown-linux-gnu
# OpenBLAS is the only backend and on Intel targets these flags are no-ops
# (the fallback code is cfg(target_arch = "aarch64")-gated). On
# aarch64-apple-darwin exactly one must be enabled — enabling both is a
# compile error (#35).
default = ["accelerate"]
accelerate = ["nuvai-mkl-src/accelerate"]
openblas = ["nuvai-mkl-src/openblas"]
# Forward static linking (x86_64-unknown-linux-gnu only — ADR-0005) to
# `nuvai-mkl-src`, the sole acquirer/emitter. See that crate's `static`
# feature doc for what this does and does not affect on other targets. **On by
# default on that target** (#72), via the target-gated edge below.
static = ["nuvai-mkl-src/static"]
# Forward the opt-out from that default: link the dynamic, threaded `mkl_rt`
# dispatcher instead (#72). See `nuvai-mkl-src`'s `dynamic` feature doc.
dynamic = ["nuvai-mkl-src/dynamic"]

[dependencies]
nuvai-mkl-src = { workspace = true }

[build-dependencies]
nuvai-mkl-src = { workspace = true }

# `static` is the default on x86_64-unknown-linux-gnu (#72) — the same pair of
# target-gated edges as `nuvai-mkl`'s, for the same reasons (a `[target.…]`
# table merges with the plain entry above and the resulting feature reaches
# downstream consumers; two edges because Cargo builds a host and a target unit
# of `nuvai-mkl-src` and does not unify features across them, with the
# `dependencies` one matched against the *target* triple and the
# `build-dependencies` one against the *host*). Repeated here rather than
# inherited, because a consumer may depend on `nuvai-mkl-sys` without the
# wrapper — that is the pair whose `DEP_MKL_*` metadata and link directives this
# crate's own unit would otherwise leave dynamic.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
nuvai-mkl-src = { workspace = true, features = ["static"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.build-dependencies]
nuvai-mkl-src = { workspace = true, features = ["static"] }

# bindgen is only needed where oneMKL headers exist (Intel targets). On
# aarch64-apple-darwin and aarch64-unknown-linux-gnu the FFI surface is
# hand-written and x86_64-apple-darwin is unsupported.
[target.'cfg(all(not(target_os = "macos"), not(target_arch = "aarch64")))'.build-dependencies]
bindgen = "0.71"

# docs.rs has no network and no MKL; build with no features so the
# docs.rs build never pulls acquisition/linking (build.rs also short-circuits on DOCS_RS).
[package.metadata.docs.rs]
all-features = false
default-features = false
